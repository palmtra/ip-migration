---
all:
  children:
    switches:
      children:
        cisco:
          hosts:
            sw-cisco-01:
              ansible_host: 192.0.2.10
              ansible_network_os: cisco.ios.ios
            sw-nxos-01:
              ansible_host: 192.0.2.11
              ansible_network_os: cisco.nxos.nxos
        arista:
          hosts:
            sw-arista-01:
              ansible_host: 192.0.2.20
              ansible_network_os: arista.eos.eos
    firewalls:
      children:
        paloalto:
          hosts:
            fw-palo-01:
              ansible_host: 192.0.2.30
              palo_vsys: vsys1
              # Set true when this inventory entry is Panorama, not a firewall.
              palo_is_panorama: false
