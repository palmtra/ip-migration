---
# Placeholders only (RFC 5737). Copy to inventories/production/hosts.yml
# (gitignored) and put real management IPs.
#
# Layout:
#   network_devices / <os>_devices / <os>_<site>  : switches and PEs
#   dc_<site>                                     : alias groups to limit by DC
#   CVAAS / panorama                              : controllers (hostname + IP only)
#
# Connection and ansible_network_os live in group_vars/.
# Per-customer Panorama device groups and templates live in vars/search/.
all:
  children:
    network_devices:
      children:
        eos_devices:
          children:
            eos_dc1:
              hosts:
                dc1-leaf-01:
                  ansible_host: 192.0.2.21
                  data_center: dc1
                dc1-aggpe-mls01:
                  ansible_host: 192.0.2.22
                  data_center: dc1
            eos_dc2:
              hosts:
                dc2-leaf-01:
                  ansible_host: 192.0.2.23
                  data_center: dc2
        ios_devices:
          children:
            ios_dc1:
              hosts:
                dc1-acc-01:
                  ansible_host: 192.0.2.11
                  data_center: dc1
        nxos_devices:
          children:
            nxos_dc2:
              hosts:
                dc2-core-01:
                  ansible_host: 192.0.2.12
                  data_center: dc2
                dc2-acc-01:
                  ansible_host: 192.0.2.13
                  data_center: dc2
    dc_dc1:
