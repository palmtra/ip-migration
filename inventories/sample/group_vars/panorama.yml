---
# PAN-OS modules run on the control node and call the XML API on Panorama.
# Device groups, templates, and serials are per-customer: vars/search/.
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"
palo_is_panorama: true
provider:
  ip_address: "{{ ansible_host | default(inventory_hostname) }}"
  username: "{{ palo_username }}"
  password: "{{ palo_password }}"
  api_key: "{{ palo_api_key | default(omit, true) }}"
  port: "{{ palo_port }}"
