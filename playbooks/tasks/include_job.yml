---
- name: Ensure artifact root exists
  ansible.builtin.file:
    path: "{{ artifact_root }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true

- name: Materialize job vars for this play
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../python/materialize_job.py"
      - --job
      - "{{ job_file }}"
      - --out
      - "{{ artifact_root }}/job_vars.json"
  delegate_to: localhost
  run_once: true
  when: job_file | default('') | length > 0
  changed_when: false

- name: Include materialized job vars
  ansible.builtin.include_vars:
    file: "{{ artifact_root }}/job_vars.json"
  when: job_file | default('') | length > 0
