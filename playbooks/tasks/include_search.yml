---
- name: Resolve customer search file
  ansible.builtin.include_tasks: resolve_search.yml

- name: Ensure artifact root exists
  ansible.builtin.file:
    path: "{{ artifact_root }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true

- name: Load search targets
  ansible.builtin.include_vars:
    file: "{{ search_file }}"
    name: search_data

- name: Expose search CIDRs and per-customer Panorama scope
  ansible.builtin.set_fact:
    search_targets: "{{ search_data.search_targets | default([]) }}"
    palo_device_groups: "{{ search_data.palo_device_groups | default([], true) }}"
    palo_templates: "{{ search_data.palo_templates | default([], true) }}"
    palo_template_stacks: "{{ search_data.palo_template_stacks | default([], true) }}"
    palo_serials: "{{ search_data.palo_serials | default([], true) }}"
