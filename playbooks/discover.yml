---
- name: Collect device usage
  ansible.builtin.import_playbook: collect.yml

# hosts: all + run_once so -l still builds the report. A hosts: localhost
# play is skipped when the limit is only switches (localhost is not in -l).
- name: Build discovery report
  hosts: all
  gather_facts: false
  run_once: true
  connection: local
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_become: false
  tasks:
    - name: Analyze artifacts
      ansible.builtin.include_tasks: tasks/analyze.yml
