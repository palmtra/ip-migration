---
- name: Collect device usage
  ansible.builtin.import_playbook: collect.yml

- name: Build discovery report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Resolve customer search file
      ansible.builtin.include_tasks: tasks/resolve_search.yml
    - name: Analyze collected artifacts against search CIDRs
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../python/analyze_hits.py"
          - --artifacts
          - "{{ artifact_root }}"
          - --search
          - "{{ search_file }}"
          - --out
          - "{{ report_root }}"
      changed_when: true
