---
- name: Collect device usage
  ansible.builtin.import_playbook: collect.yml

- name: Build discovery report
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load customer job
      ansible.builtin.include_tasks: tasks/include_job.yml
  tasks:
    - name: Analyze collected artifacts
      ansible.builtin.command:
        argv: "{{ analyze_argv }}"
      vars:
        analyze_base:
          - python3
          - "{{ playbook_dir }}/../python/analyze_hits.py"
          - --artifacts
          - "{{ artifact_root }}"
          - --out
          - "{{ report_root }}"
        analyze_argv: >-
          {{
            analyze_base
            + (['--job', job_file] if (job_file | default('') | length > 0) else ['--search', search_file])
          }}
      changed_when: true
