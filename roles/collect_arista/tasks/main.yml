---
- name: Write device metadata
  ansible.builtin.copy:
    dest: "{{ device_artifact_dir }}/meta.json"
    mode: "0644"
    content: "{{ meta | to_nice_json }}"
  vars:
    meta:
      device: "{{ inventory_hostname }}"
      mgmt_ip: "{{ ansible_host | default(inventory_hostname) }}"
      platform: arista.eos.eos
      vendor: arista
      role: "{{ 'aggpe' if ('aggpe' in group_names or 'aggpe' in inventory_hostname) else 'switch' }}"
      data_center: "{{ data_center | default('') }}"
      vrfs: []
  delegate_to: localhost

- name: Gather EOS facts
  arista.eos.eos_facts:
    gather_subset:
      - interfaces
      - hardware

- name: Initialize EOS command merge lists
  ansible.builtin.set_fact:
    eos_all_commands: []
    eos_all_stdout: []
    eos_vrf_names:
      - default

# Do not dump show ip bgp vrf all | json: the Loc-RIB JSON on a PE routinely
# exceeds command_timeout. BGP network statements come from running-config.
# Collect RIB per VRF so one large table cannot fail the whole routing batch.
- name: Run EOS light discovery batches
  arista.eos.eos_command:
    commands: "{{ item.commands }}"
  vars:
    ansible_command_timeout: "{{ eos_command_timeout | default(600) }}"
  loop:
    - name: interfaces
      commands:
        - show ip interface brief | json
        - show ipv6 interface brief | json
        - show ip virtual-router | json
        - show mlag | json
        - show vlan | json
    - name: forwarding
      commands:
        - show ip arp vrf all | json
        - show ipv6 neighbor | json
        - show ip access-lists | json
    - name: running-config
      commands:
        - show running-config
    - name: bgp-summary
      commands:
        - show ip bgp summary vrf all | json
  loop_control:
    label: "{{ item.name }}"
  register: eos_light_batches
  ignore_errors: true

- name: Record light EOS batches
  ansible.builtin.include_tasks: append_show.yml
  loop: "{{ eos_light_batches.results }}"
  loop_control:
    loop_var: result

- name: Collect EOS VRF names
  arista.eos.eos_command:
    commands:
      - show vrf | json
  vars:
    ansible_command_timeout: "{{ eos_command_timeout | default(600) }}"
  register: eos_vrf_cmd
  ignore_errors: true

- name: Record EOS VRF command
  ansible.builtin.include_tasks: append_show.yml
  vars:
    result: "{{ eos_vrf_cmd }}"

- name: Set EOS VRF list from JSON
  ansible.builtin.set_fact:
    eos_vrf_names: "{{ (vrf_keys | default([])) | union(['default']) | unique | list }}"
  when:
    - not (eos_vrf_cmd.failed | default(false) | bool)
    - (eos_vrf_cmd.stdout | default([]) | length) > 0
  vars:
    eos_vrf_blob: "{{ eos_vrf_cmd.stdout[0] }}"
    eos_vrf_obj: "{{ eos_vrf_blob if (eos_vrf_blob is mapping) else (eos_vrf_blob | from_json) }}"
    vrf_keys: "{{ (eos_vrf_obj.vrfs | default({})).keys() | list if (eos_vrf_obj.vrfs is mapping) else [] }}"

- name: Build per-VRF EOS RIB commands
  ansible.builtin.set_fact:
    eos_rib_commands: "{{ eos_v4_rib + eos_v6_rib }}"
  vars:
    eos_v4_rib: "{{ eos_vrf_names | map('regex_replace', '^(.*)$', 'show ip route vrf \\1 | json') | list }}"
    eos_v6_rib: "{{ eos_vrf_names | map('regex_replace', '^(.*)$', 'show ipv6 route vrf \\1 | json') | list }}"

- name: Run EOS per-VRF route commands
  arista.eos.eos_command:
    commands: "{{ eos_rib_commands[item : item + 4] }}"
  vars:
    ansible_command_timeout: "{{ eos_command_timeout | default(600) }}"
  loop: "{{ range(0, eos_rib_commands | length, 4) | list }}"
  register: eos_route_batches
  when: eos_rib_commands | length > 0
  ignore_errors: true

- name: Record EOS route batches
  ansible.builtin.include_tasks: append_show.yml
  loop: "{{ (eos_route_batches | default({})).results | default([]) }}"
  loop_control:
    loop_var: result
  when: (eos_route_batches | default({})).results is defined

- name: Warn on EOS batches that timed out
  ansible.builtin.debug:
    msg: >-
      EOS batch '{{ item.item.name | default(item.item) }}' failed on
      {{ inventory_hostname }} ({{ item.msg | default('timeout or error') }}).
      Other batches were saved.
  loop: "{{ (eos_light_batches.results | default([])) + ((eos_route_batches | default({})).results | default([])) }}"
  loop_control:
    label: "{{ item.item.name | default(item.item) }}"
  when: item.failed | default(false) | bool

- name: Merge EOS command batches
  ansible.builtin.set_fact:
    eos_show:
      commands: "{{ eos_all_commands | default([]) }}"
      stdout: "{{ eos_all_stdout | default([]) }}"
      invocation:
        module_args:
          commands: "{{ eos_all_commands | default([]) }}"

- name: Require some EOS command output
  ansible.builtin.assert:
    that:
      - (eos_show.stdout | default([]) | length) > 0
    fail_msg: >-
      All EOS discovery command batches failed on {{ inventory_hostname }}.
      Increase eos_command_timeout (default 600) in group_vars/eos_devices.yml
      if you still see command timeout triggered.

- name: Save EOS command output
  ansible.builtin.copy:
    dest: "{{ device_artifact_dir }}/{{ item.file }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - file: facts.json
      content: "{{ ansible_facts | to_nice_json }}"
    - file: show_commands.json
      content: "{{ eos_show | to_nice_json }}"
  loop_control:
    label: "{{ item.file }}"
  delegate_to: localhost
